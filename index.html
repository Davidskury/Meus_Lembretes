<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Lembretes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>📌 Meus Lembretes</h1>

    <!-- Formulário de Entrada -->
    <div class="card-inputs">
      <div class="form-group">
        <label for="input-texto">Descrição do Lembrete:</label>
        <input type="text" id="input-texto" placeholder="Ex: Comprar leite no mercado...">
      </div>

      <div class="form-group">
        <label for="select-prioridade">Prioridade:</label>
        <select id="select-prioridade">
          <option value="baixa">Baixa</option>
          <option value="media">Média</option>
          <option value="alta">Alta</option>
        </select>
      </div>

      <div class="form-group">
        <label for="input-data-vencimento">Data de Vencimento:</label>
        <input type="date" id="input-data-vencimento">
      </div>

      <button id="btn-adicionar">Adicionar Lembrete</button>
      <p id="msg-erro" class="erro"></p>
    </div>

    <!-- Novo Card de Busca atualizado com classe card-inputs e fundo branco -->
    <div class="card-inputs card-busca" style="margin-top: 15px; padding: 15px; border: 1px solid #ccc; border-radius: 6px; background-color: #ffffff;">
      <!-- Campo Retangular de Busca com Placeholder -->
      <div class="form-group" style="margin-bottom: 12px;">
        <input type="text" id="input-busca" placeholder="🔍️Buscar Lembretes..." style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>

      <!-- Três labels com opções uma ao lado da outra -->
      <div class="filtros-container" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px;">
        <!-- Status -->
        <label style="display: flex; flex-direction: column; flex: 1; font-size: 14px;">
          Status:
          <select id="filtro-status" style="margin-top: 4px; padding: 4px;">
            <option value="todos">Todos</option>
            <option value="ativo">Ativo</option>
            <option value="concluido">Concluído</option>
          </select>
        </label>

        <!-- Prioridade -->
        <label style="display: flex; flex-direction: column; flex: 1; font-size: 14px;">
          Prioridade:
          <select id="filtro-prioridade" style="margin-top: 4px; padding: 4px;">
            <option value="todas">Todas</option>
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
          </select>
        </label>

        <!-- Data -->
        <label style="display: flex; flex-direction: column; flex: 1; font-size: 14px;">
          Data de Vencimento:
          <input type="date" id="filtro-data" style="margin-top: 4px; padding: 3px;">
        </label>
      </div>

      <!-- Botão Buscar -->
      <button id="btn-buscar" type="button" style="padding: 6px 16px; cursor: pointer;">Buscar</button>
      
      <!-- Separação com HR -->
      <hr style="margin: 20px 0;">

      <!-- Linha Horizontal com Contador e Botão de Excluir Concluídos -->
      <div class="painel-status" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <!-- Canto Esquerdo - Contador -->
        <span id="contador-concluidos" style="font-weight: bold; font-size: 14px;">0 de 0 concluído(s)</span>

        <!-- Canto Direito - Botão Excluir Concluídos -->
        <button id="btn-excluir-concluidos" type="button" style="background-color: transparent; color: #dc3545; border: 1px solid #dc3545; padding: 5px 10px; border-radius: 4px; cursor: pointer; opacity: 0.7; transition: all 0.2s ease;">
          Excluir Concluídos
        </button>
      </div>
    </div>

    

    <!-- Container onde os cards serão gerados dinamicamente -->
    <section id="lista-lembretes" class="grid-lembretes"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
